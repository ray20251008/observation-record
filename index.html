<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>兩週觀察與介入期紀錄系統</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">

    <!-- Header Section -->
    <header class="bg-[var(--card)] border border-[var(--border)] rounded-2xl p-6 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-amber-500/10 text-amber-600 rounded-full text-xs font-semibold mb-2">
          <span>📋 社工/教保員 數位表單系統</span>
        </div>
        <h1 class="text-2xl font-bold text-[var(--foreground)]">兩週觀察與介入期紀錄表</h1>
        <p class="text-sm text-[var(--muted-foreground)] mt-1">針對個案注意尋求、等待能力與介入處置之結構化紀錄工具</p>
      </div>

      <div class="flex flex-wrap gap-2">
        <button onclick="saveToLocalStorage()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-lg shadow transition flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
          暫存系統
        </button>
        <button onclick="exportJSON()" class="px-4 py-2 border border-[var(--border)] bg-[var(--card)] hover:bg-slate-100 dark:hover:bg-slate-800 text-[var(--foreground)] font-medium text-sm rounded-lg transition flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          匯出 JSON
        </button>
        <button onclick="window.print()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg shadow transition flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          一鍵列印 / 存為 PDF
        </button>
      </div>
    </header>

    <!-- Basic Info Bar -->
    <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 shadow-sm">
      <h2 class="text-sm font-semibold text-[var(--foreground)] mb-3 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-blue-500"></span> 基本資訊設定
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-medium text-[var(--muted-foreground)] mb-1">服務對象 (姓名/代號)</label>
          <input type="text" id="clientName" value="林○嫻" class="w-full px-3 py-2 text-sm bg-[var(--background)] border border-[var(--border)] rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-[var(--foreground)]">
        </div>
        <div>
          <label class="block text-xs font-medium text-[var(--muted-foreground)] mb-1">紀錄工作人員</label>
          <input type="text" id="staffName" placeholder="填寫社工/教保員姓名" class="w-full px-3 py-2 text-sm bg-[var(--background)] border border-[var(--border)] rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-[var(--foreground)]">
        </div>
        <div>
          <label class="block text-xs font-medium text-[var(--muted-foreground)] mb-1">觀察/介入起始日期</label>
          <input type="date" id="startDate" class="w-full px-3 py-2 text-sm bg-[var(--background)] border border-[var(--border)] rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-[var(--foreground)]">
        </div>
        <div>
          <label class="block text-xs font-medium text-[var(--muted-foreground)] mb-1">所屬機構/單位</label>
          <input type="text" id="facility" value="瑞翔社區日間作業所" class="w-full px-3 py-2 text-sm bg-[var(--background)] border border-[var(--border)] rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-[var(--foreground)]">
        </div>
      </div>
    </div>

    <!-- Week Selector Tabs -->
    <div class="flex border-b border-[var(--border)] space-x-2">
      <button id="tabWeek1" onclick="switchWeek(1)" class="px-5 py-3 font-semibold text-sm border-b-2 border-blue-600 text-blue-600 flex items-center gap-2">
        <span>🗓️ 第一週：觀察期紀錄表</span>
        <span class="text-xs bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-300 px-2 py-0.5 rounded-full">手語圖卡提醒・不立即回應</span>
      </button>
      <button id="tabWeek2" onclick="switchWeek(2)" class="px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-[var(--muted-foreground)] hover:text-[var(--foreground)] flex items-center gap-2">
        <span>⏳ 第二週：介入期紀錄表</span>
        <span class="text-xs bg-purple-100 text-purple-800 dark:bg-purple-900/40 dark:text-purple-300 px-2 py-0.5 rounded-full">引入計時・約定時間回應</span>
      </button>
    </div>

    <!-- Form Container -->
    <div id="formContainer" class="space-y-6">
      <!-- Dynamic Form Cards Inserted via JS -->
    </div>

  </div>

  <script>
    // Initialize default date
    document.getElementById('startDate').valueAsDate = new Date();

    let currentWeek = 1;
    let customTagsStore = JSON.parse(localStorage.getItem('custom_observation_tags') || '{}');

    const itemsWeek1 = [
      {
        id: "w1_1",
        title: "1. 社工與他人互動時的干擾",
        guide: "• 社工與誰互動？距離多遠？個案做什麼？\n• 是否先出現注視、靠近、敲擊？\n• 給予手語／圖卡提醒後，是否停止、等待或改用其他方式？\n• 能等待多久？行為是否再次出現？多久後恢復正常？",
        tags: ["社工離個案 1m 內", "距離個案 2m 以上", "注視與靠近", "敲擊桌面", "大聲呼喚", "點頭可配合等待", "手語圖卡提醒", "等待時間 < 1min", "等待時間 1-3min", "等待時間 > 3min", "無法等待再次干擾", "自動離去"],
        fields: [
          { label: "情境說明", placeholder: "例如：社工正與張員討論ISP計畫，距離個案約2公尺..." },
          { label: "個案反應", placeholder: "例如：給予「等待」圖卡後，個案注視圖卡約 30 秒後回到座位..." },
          { label: "等待時間", placeholder: "例如：約 1 分半鐘" },
          { label: "後續行為", placeholder: "例如：恢復原本彩繪作業，未再次中途打斷" }
        ]
      },
      {
        id: "w1_2",
        title: "2. 社工忙碌時的注意尋求",
        guide: "• 社工忙碌時是否主動靠近、敲桌、戳碰、放物品或呼喚？\n• 給予手語／圖卡提醒、暫不立即回應後，記錄是否能等待及等待極限。\n• 是否能自行回到活動？是否再次尋求注意？",
        tags: ["主動靠近放物品", "敲打桌子求注意", "拉拽衣角", "文字提醒可等待", "圖卡提醒暫止", "自行回座位活動", "重複喚醒 3 次以上", "需要2次以上提示"],
        fields: [
          { label: "情境說明", placeholder: "例如：社工正打字處理行政報表..." },
          { label: "個案反應", placeholder: "例如：敲桌2次，出示圖卡後暫止..." },
          { label: "等待時間", placeholder: "例如：2 分鐘" },
          { label: "後續行為", placeholder: "例如：拿畫冊繼續完成，之後無再次敲桌" }
        ]
      },
      {
        id: "w1_3",
        title: "3. 肢體干擾他人",
        guide: "• 發生前對方做了什麼？是否與社工互動？個案距離多遠？\n• 給予圖卡提示並延遲回應，是否需要多次提醒？\n• 是否停止？停止多久？之後是否再次接近同一人？",
        tags: ["拍打同儕肩膀", "拉拽他人衣角", "拿走他人工具", "圖卡提示後收手", "需多次圖卡提示", "無肢體衝突", "情緒激動", "冷靜後回座"],
        fields: [
          { label: "情境說明", placeholder: "例如：同儕正在收拾金紙工具箱..." },
          { label: "個案反應", placeholder: "例如：伸手欲拉同儕，提示圖卡後收手..." },
          { label: "等待時間", placeholder: "例如：持續觀察 5 分鐘" },
          { label: "後續行為", placeholder: "例如：轉向操作個人工具" }
        ]
      },
      {
        id: "w1_4",
        title: "4. 接觸或拿取他人物品",
        guide: "• 是否先詢問？是什麼物品？是否主動前往特定位置取得？\n• 提供借用卡／手勢「先問」但暫不給予時，記錄反應。\n• 是否歸還？之後是否再次拿取？",
        tags: ["未詢問直接拿取", "欲拿取色鉛筆", "欲拿取剪刀/起子", "給予借用卡指引", "出示「先問」圖卡", "主動歸還原處", "可等待授權"],
        fields: [
          { label: "情境說明", placeholder: "例如：欲拿取鄰桌同學的繪畫色鉛筆..." },
          { label: "個案反應", placeholder: "例如：出示「先問」圖卡，個案收回手..." },
          { label: "等待時間", placeholder: "例如：1 分鐘" },
          { label: "後續行為", placeholder: "例如：使用自己桌上的替代畫筆" }
        ]
      },
      {
        id: "w1_5",
        title: "5. 危險工具取得或使用",
        guide: "• 是否主動尋找工具？從哪裡取得？當時情境及目的為何？\n• 發現剪刀、螺絲起子等工具時，支持者如何介入（立即收回並給予圖卡）？\n• 移除後是否再次尋找？是否轉換其他行為？",
        tags: ["拿取剪刀/起子", "拿取美工刀", "從備料區取得", "工作人員立即介入", "給予安全視覺卡", "立即收回工具", "情緒平穩轉換", "無攻擊行為"],
        fields: [
          { label: "情境說明", placeholder: "例如：個案走到教保櫃檯旁欲拿取剪刀..." },
          { label: "安全處置", placeholder: "例如：工作人員隨即收回工具，並出示「安全規範卡」..." },
          { label: "個案後續反應", placeholder: "例如：個案點頭並走回自身座位，無焦躁舉動" }
        ]
      },
      {
        id: "w1_6",
        title: "6. 不滿／等待時的替代表達",
        guide: "• 當她沒有得到想要的回應時，原本會做什麼？\n• 提供「等待、喝水、離開、寫字」等選項卡，看她是否能選擇。\n• 是否成功使用替代方式？需要多少提示？",
        tags: ["選擇「喝水」", "選擇「寫字/塗鴉」", "選擇「短暫離座」", "選擇「拼圖/繪畫」", "需要 1 次提示", "獨立完成替代活動", "無法選擇仍急躁"],
        fields: [
          { label: "情境說明", placeholder: "例如：無法立即與社工對話時顯得急躁..." },
          { label: "選擇的替代方式", placeholder: "例如：從圖卡中選擇「喝水」並前往飲水機..." },
          { label: "提示需求量與成效", placeholder: "例如：口頭+圖卡 1 次提示，情緒恢復穩定" }
        ]
      }
    ];

    const itemsWeek2 = [
      {
        id: "w2_1",
        title: "1. 社工與他人互動時的干擾 (計時介入)",
        guide: "• 出示等待圖卡，並配合計時工具（如：「等藍色沙漏流完／指針到數字5」）。\n• 記錄使用計時後，個案的等待穩定度是否提升？是否減少干擾行為？",
        tags: ["使用 3 分鐘沙漏", "使用 5 分鐘計時", "使用碼錶/手機", "定時指針約定", "完整等待至計時結束", "觀看沙漏靜候", "干擾頻率明顯下降", "未達預定時間起立"],
        fields: [
          { label: "使用之計時工具", placeholder: "例如：藍色3分鐘沙漏" },
          { label: "實際等待時間", placeholder: "例如：完整等待 3 分鐘" },
          { label: "行為表現與成效", placeholder: "例如：個案時不時觀看沙漏，安靜等待至計時結束，干擾行為為 0" }
        ]
      },
      {
        id: "w2_2",
        title: "2. 社工忙碌時的注意尋求 (計時介入)",
        guide: "• 告知「現在忙，等一下」，並指著計時器設定明確等待時間。\n• 記錄個案是否能看著計時器等待？是否能自行回到座位或活動？",
        tags: ["設定 3 分鐘計時", "設定 5 分鐘計時", "觀看計時器等待", "順利回到座位", "提示 1 次即配合", "配合度 100%", "鬧鐘響後再次尋求"],
        fields: [
          { label: "設定等待時間長度", placeholder: "例如：設定 5 分鐘" },
          { label: "個案配合度", placeholder: "例如：高度配合，能看著倒數計時" },
          { label: "是否順利過渡", placeholder: "例如：順利在座位上完成文字練習直至鬧鈴響" }
        ]
      },
      {
        id: "w2_3",
        title: "3. 肢體干擾他人 (計時介入)",
        guide: "• 發生時制止並引導：「不能推，看計時器，等時間到再找人」。\n• 記錄引入計時後，個案是否較容易冷靜？是否降低再次接近同一人的衝動？",
        tags: ["即時指引計時器", "冷靜速度加快", "肢體衝動降低", "未再接近同一人", "情緒表現平穩", "配合指引看計時"],
        fields: [
          { label: "介入情境", placeholder: "例如：欲伸手推同儕時被工作人員及時指引..." },
          { label: "計時引導反應", placeholder: "例如：看著計時器數字倒數，呼吸趨於平緩" },
          { label: "後續互動狀況", placeholder: "例如：時間到達後，經引導改用輕輕拍手示意，互動良善" }
        ]
      },
      {
        id: "w2_4",
        title: "4. 接觸或拿取他人物品 (計時介入)",
        guide: "• 提供「先問」圖卡與計時卡，引導個案「等一下、先詢問」。\n• 記錄個案是否能等待同意再拿取？是否減少未經同意直接拿取的頻率？",
        tags: ["圖卡+計時配合", "先詢問再拿取", "直接拿取頻率降為0", "能等待同儕回應", "展現禮貌互動", "沙漏跑完才借用"],
        fields: [
          { label: "物品名稱", placeholder: "例如：公用作業剪刀" },
          { label: "提示與計時狀況", placeholder: "例如：引導「等沙漏跑完才可以借」，個案專注觀看沙漏" },
          { label: "是否成功改用詢問", placeholder: "例如：成功！沙漏結束後點頭示意詢問後才拿取" }
        ]
      },
      {
        id: "w2_5",
        title: "5. 危險工具取得或使用 (計時介入)",
        guide: "• 發現工具時立即移除，並配合視覺卡及短暫計時冷靜。\n• 記錄移除工具後，個案透過計時轉換注意力的效果，是否不再持續尋找？",
        tags: ["短暫 2 分鐘計時冷靜", "注意力順利轉移", "未持續尋找工具", "冷靜卡發揮功效", "無抗拒情緒", "轉移至打字/繪畫"],
        fields: [
          { label: "工具類型", placeholder: "例如：大型美工刀" },
          { label: "移除與計時引導", placeholder: "例如：收回美工刀，提供「計時冷靜卡」設定 2 分鐘" },
          { label: "後續行為轉移狀況", placeholder: "例如：2分鐘內專注於打字練習，不再尋找刀具" }
        ]
      },
      {
        id: "w2_6",
        title: "6. 不滿／等待時的替代表達 (計時介入)",
        guide: "• 提供替代選項（喝水、寫字等）並配合計時等待。\n• 記錄個案是否能更順暢地透過替代方式度過等待期，降低回到危險行為的機率。",
        tags: ["替代活動+計時結合", "順利度過等待期", "情緒失控率顯著降低", "主動選取替代卡", "效果良好", "配合計時完成"],
        fields: [
          { label: "使用的替代選項", placeholder: "例如：寫字平板 + 3分鐘計時" },
          { label: "計時配合狀況", placeholder: "例如：主動在平板寫字等待倒數計時" },
          { label: "替代成效評估", placeholder: "例如：情緒完全穩定，等待成效良好" }
        ]
      }
    ];

    function renderForm() {
      const container = document.getElementById('formContainer');
      container.innerHTML = '';
      const items = currentWeek === 1 ? itemsWeek1 : itemsWeek2;

      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = "bg-[var(--card)] border border-[var(--border)] rounded-2xl p-6 shadow-sm space-y-4 hover:border-blue-300 dark:hover:border-blue-800 transition";

        let fieldsHTML = '';
        item.fields.forEach(f => {
          fieldsHTML += `
            <div>
              <label class="block text-xs font-semibold text-[var(--muted-foreground)] mb-1">${f.label}</label>
              <textarea rows="2" id="${item.id}_${f.label}" placeholder="${f.placeholder}" class="w-full px-3 py-2 text-sm bg-[var(--background)] border border-[var(--border)] rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-[var(--foreground)]"></textarea>
            </div>
          `;
        });

        // Combine default tags + custom tags
        const userCustom = customTagsStore[item.id] || [];
        const allTags = [...item.tags, ...userCustom];

        let tagsHTML = '';
        allTags.forEach(tag => {
          const isUserAdded = userCustom.includes(tag);
          tagsHTML += `
            <button type="button" onclick="insertTag('${item.id}', '${tag}')" class="px-2.5 py-1 text-xs ${isUserAdded ? 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300 border-amber-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700'} hover:bg-blue-100 dark:hover:bg-blue-900/50 rounded-md border transition">
              + ${tag} ${isUserAdded ? '★' : ''}
            </button>
          `;
        });

        tagsHTML += `
          <button type="button" onclick="promptAddTag('${item.id}')" class="px-2.5 py-1 text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md shadow-sm transition flex items-center gap-1">
            <span>+ 新增自訂標籤</span>
          </button>
        `;

        card.innerHTML = `
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-2 border-b border-[var(--border)] pb-3">
            <h3 class="text-base font-bold text-[var(--foreground)] flex items-center gap-2">
              <span class="flex items-center justify-center w-6 h-6 rounded-full bg-blue-600 text-white text-xs font-bold">${index + 1}</span>
              ${item.title}
            </h3>
            <span class="text-xs text-[var(--muted-foreground)] bg-slate-100 dark:bg-slate-800 px-2.5 py-1 rounded-md">單項追蹤</span>
          </div>

          <div class="p-3 bg-amber-500/5 border border-amber-500/20 rounded-xl text-xs text-amber-800 dark:text-amber-300 whitespace-pre-line leading-relaxed">
            <strong>💡 觀察重點說明：</strong>
            ${item.guide}
          </div>

          <div>
            <label class="block text-xs font-medium text-[var(--muted-foreground)] mb-1.5">⚡ 點選速填標籤 (自動插入第一個備註欄位)：</label>
            <div class="flex flex-wrap gap-1.5" id="tags_${item.id}">
              ${tagsHTML}
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
            ${fieldsHTML}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function insertTag(itemId, tagText) {
      const items = currentWeek === 1 ? itemsWeek1 : itemsWeek2;
      const targetItem = items.find(i => i.id === itemId);
      if (targetItem && targetItem.fields.length > 0) {
        const firstFieldId = `${itemId}_${targetItem.fields[0].label}`;
        const input = document.getElementById(firstFieldId);
        if (input) {
          if (input.value) {
            input.value += `【${tagText}】`;
          } else {
            input.value = `【${tagText}】`;
          }
        }
      }
    }

    function promptAddTag(itemId) {
      const newTag = prompt("請輸入欲新增的速填標籤名稱（例如：手語提醒、冷靜區、離座5分鐘）：");
      if (newTag && newTag.trim()) {
        const trimmed = newTag.trim();
        if (!customTagsStore[itemId]) {
          customTagsStore[itemId] = [];
        }
        if (!customTagsStore[itemId].includes(trimmed)) {
          customTagsStore[itemId].push(trimmed);
          localStorage.setItem('custom_observation_tags', JSON.stringify(customTagsStore));
          renderForm();
        }
      }
    }

    function switchWeek(weekNum) {
      currentWeek = weekNum;
      const t1 = document.getElementById('tabWeek1');
      const t2 = document.getElementById('tabWeek2');

      if (weekNum === 1) {
        t1.className = "px-5 py-3 font-semibold text-sm border-b-2 border-blue-600 text-blue-600 flex items-center gap-2";
        t2.className = "px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-[var(--muted-foreground)] hover:text-[var(--foreground)] flex items-center gap-2";
      } else {
        t2.className = "px-5 py-3 font-semibold text-sm border-b-2 border-purple-600 text-purple-600 flex items-center gap-2";
        t1.className = "px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-[var(--muted-foreground)] hover:text-[var(--foreground)] flex items-center gap-2";
      }
      renderForm();
    }

    function saveToLocalStorage() {
      const data = gatherFormData();
      localStorage.setItem('two_week_observation_data', JSON.stringify(data));
      alert('✅ 資料已成功儲存至本機快取！下次開啟本網頁可繼續編輯。');
    }

    function gatherFormData() {
      const client = document.getElementById('clientName').value;
      const staff = document.getElementById('staffName').value;
      const date = document.getElementById('startDate').value;
      const facility = document.getElementById('facility').value;

      const records = {};
      const items = currentWeek === 1 ? itemsWeek1 : itemsWeek2;
      items.forEach(item => {
        records[item.id] = {};
        item.fields.forEach(f => {
          const el = document.getElementById(`${item.id}_${f.label}`);
          records[item.id][f.label] = el ? el.value : '';
        });
      });

      return {
        clientName: client,
        staffName: staff,
        startDate: date,
        facility: facility,
        week: currentWeek,
        records: records,
        savedAt: new Date().toLocaleString()
      };
    }

    function exportJSON() {
      const data = gatherFormData();
      const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
      const anchor = document.createElement('a');
      anchor.setAttribute("href", str);
      anchor.setAttribute("download", `兩週觀察與介入紀錄_${data.clientName || '個案'}_Week${currentWeek}.json`);
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    }

    // Initial Render
    renderForm();
  </script>
</body>
</html>
